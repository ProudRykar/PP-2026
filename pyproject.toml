[project]
name = "omnichannel"
version = "0.1.0"
description = "Omnichannel messaging solution"
authors = [
    {name = "Developer"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "litestar (>=2.0.0,<3.0.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "punq (>=0.7.0,<0.8.0)",
    "python-telegram-bot (>=22.7,<23.0)",
    "slack-bolt (>=1.28.0,<2.0.0)",
    "discord-py (>=2.7.1,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "aiosmtpd (>=1.4.6,<2.0.0)",
    "imapclient (>=3.1.0,<4.0.0)",
    "aiohttp (>=3.12.0,<4.0.0)",
    "ruff (>=0.15.15,<0.16.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "websockets (>=15.0,<16.0)",
    "gutarik (>=0.1.2,<0.2.0)",
    "mkdocs (>=1.6.1,<2.0.0)",
    "mkdocs-material (>=9.7.6,<10.0.0)",
    "boto3 (>=1.43.23,<2.0.0)",
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
ignore_missing_imports = true

[tool.gutarik]
project_dirs = ["app", "tests"]
docs_dir = "docs"
supported_ext = [".py"]
wiki_repo = "https://github.com/ProudRykar/PP-2026/wiki"
local_wiki_dir = ".wiki_tmp"
exclude_dirs = []

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "boto3-stubs[essential,s3] (>=1.43.33,<2.0.0)"
]
