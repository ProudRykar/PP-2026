[project]
name = "omnichannel"
version = "0.1.0"
description = "Omnichannel messaging solution"
authors = [
    {name = "Developer"}
]
requires-python = "^3.14"
dependencies = [
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "punq (>=0.7.0,<0.8.0)",
    "python-telegram-bot (>=22.7,<23.0)",
    "slack-bolt (>=1.28.0,<2.0.0)",
    "discord-py (>=2.7.1,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pydantic (>=2.13.3,<3.0.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "aiosmtpd (>=1.4.6,<2.0.0)",
    "imapclient (>=3.1.0,<4.0.0)",
    "aiohttp (>=3.12.0,<4.0.0)",
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = [".", "src"]
asyncio_mode = "auto"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
